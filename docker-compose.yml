services:
  postgres:
    image: postgres:16-alpine
    container_name: payora-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-payora_ledger}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - payora-network

  redis:
    image: redis:7-alpine
    container_name: payora-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - payora-network

  mailpit:
    image: axllent/mailpit:latest
    container_name: payora-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web UI port
    networks:
      - payora-network

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: payora-auth-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-payora_ledger}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - payora-network

  ledger-service:
    build:
      context: .
      dockerfile: services/ledger-service/Dockerfile
    container_name: payora-ledger-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-payora_ledger}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?WEBHOOK_SECRET must be set in .env}
      MERCHANT_QR_SECRET: ${MERCHANT_QR_SECRET:?MERCHANT_QR_SECRET must be set in .env}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - payora-network

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: payora-notification-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3002
      REDIS_URL: redis://redis:6379
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    depends_on:
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - payora-network

  risk-service:
    build:
      context: .
      dockerfile: services/risk-service/Dockerfile
    container_name: payora-risk-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3003
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - payora-network

  mock-provider:
    build:
      context: .
      dockerfile: services/mock-provider/Dockerfile
    container_name: payora-mock-provider
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3004
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?WEBHOOK_SECRET must be set in .env}
      LEDGER_WEBHOOK_URL: http://ledger-service:3000/api/provider/webhook
    networks:
      - payora-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: payora-frontend
    restart: unless-stopped
    networks:
      - payora-network

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: payora-gateway
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - auth-service
      - ledger-service
      - notification-service
      - risk-service
      - mock-provider
      - frontend
    networks:
      - payora-network

volumes:
  postgres_data:
  redis_data:

networks:
  payora-network:
    driver: bridge
