name: ci

on:
  push:
    branches: ["main", "setup", "feat/**", "phase-**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Node ${{ matrix.node-version }} - Unit, Property & Concurrency Tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-secret-not-real-password
          POSTGRES_DB: payora_ledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run tests across monorepo
        run: npm test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:test-secret-not-real-password@localhost:5432/payora_ledger
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-not-real-jwt-key-with-min-32-chars
          WEBHOOK_SECRET: test-secret-not-real-webhook-key-min-32-chars

      - name: Run Concurrency & Invariant Tests
        run: npm run test:concurrency --workspace=@payora/ledger-service
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:test-secret-not-real-password@localhost:5432/payora_ledger
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-not-real-jwt-key-with-min-32-chars
          WEBHOOK_SECRET: test-secret-not-real-webhook-key-min-32-chars

      - name: Build React Frontend
        run: npm run build --workspace=@payora/frontend

  docker-build:
    name: Docker Stack Verification
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Compose Build
        run: |
          cp .env.example .env
          docker compose build --parallel
